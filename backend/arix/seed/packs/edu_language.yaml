level_test:
  code: placement
  course: general_en
  title: Тест уровня
  lang: ru
  questions:
    - q: 'Как лучше начать английский?'
      options: ['С нуля, спокойно', 'Сразу сложные тексты', 'Только зубрёжка']
      answer: 0
    - q: 'Что важнее на старте?'
      options: ['Понимать базу', 'Запомнить всё сразу', 'Пропустить правила']
      answer: 0
    - q: 'Как часто нужны занятия?'
      options: ['Регулярно 2–3 раза в неделю', 'Раз в месяц', 'Только перед экзаменом']
      answer: 0
    - q: 'Что делать с ошибкой?'
      options: ['Разобрать и повторить', 'Игнорировать', 'Бросить тему']
      answer: 0
    - q: 'Домашнее задание нужно?'
      options: ['Короткое и регулярное', 'Не нужно никогда', 'Только если скучно']
      answer: 0
    - q: 'Как выбрать темп?'
      options: ['По уровню, без гонки', 'Максимально быстро любой ценой', 'Как получится']
      answer: 0
    - q: 'Что помогает запомнить?'
      options: ['Практика маленькими порциями', 'Одна ночь перед тестом', 'Ничего не повторять']
      answer: 0
    - q: 'Если пропустил урок?'
      options: ['Наверстать по конспекту', 'Пропустить весь курс', 'Спрашивать чужие оценки']
      answer: 0
    - q: 'Как готовиться к пробному?'
      options: ['Прийти вовремя с тетрадью', 'Учить всю программу за ночь', 'Не приходить']
      answer: 0
    - q: 'Что спрашивать у преподавателя?'
      options: ['То, что непонятно', 'Чужие результаты', 'Гарантию балла']
      answer: 0
    - q: 'Как относиться к срокам?'
      options: ['Держать ритм группы', 'Сдвигать всё на потом', 'Не смотреть расписание']
      answer: 0
    - q: 'Зачем тест уровня?'
      options: ['Попасть в свою группу', 'Получить диплом', 'Узнать чужой балл']
      answer: 0
  bands:
    - {min: 0, max: 3, level: A1}
    - {min: 4, max: 6, level: A2}
    - {min: 7, max: 8, level: B1}
    - {min: 9, max: 10, level: B2}
    - {min: 11, max: 12, level: C1}
kb:
  - type: faq
    question: 'Где вы находитесь и как добраться?'
    answer: 'Адрес и ориентиры подскажет администратор, парковка есть у входа.'
    lang: ru
  - type: faq
    question: 'Какие часы работы?'
    answer: 'Пн–сб 09:00–20:00, воскресенье выходной.'
    lang: ru
  - type: faq
    question: 'Как оплатить обучение?'
    answer: 'Наличные в кассе, перевод на карту или ссылка Click / Payme / Kaspi. Автосписания нет.'
    lang: ru
  - type: faq
    question: 'Есть ли рассрочка?'
    answer: 'Рассрочку согласует администратор. Бот сумму рассрочки не назначает.'
    lang: ru
  - type: faq
    question: 'Какие условия возврата денег?'
    answer: 'Возврат возможен за неоказанные занятия, пропорционально оставшимся урокам, в течение 10 рабочих дней после письменного заявления. Уже проведённые занятия не возвращаются.'
    verbatim: true
    lang: ru
  - type: faq
    question: 'Можно ли вернуть деньги за пропущенные занятия?'
    answer: 'Пропуск без предупреждения не возвращается. Перенос согласует администратор.'
    verbatim: true
    lang: ru
  - type: faq
    question: 'Пробное занятие бесплатное?'
    answer: 'Первое пробное занятие бесплатное, если в карточке курса не сказано иначе.'
    lang: ru
  - type: faq
    question: 'Сколько длится пробное?'
    answer: 'Обычно 60 минут. Точное время придёт в подтверждении записи.'
    lang: ru
  - type: faq
    question: 'Что взять на пробное?'
    answer: 'Тетрадь и ручку. Учебник на пробном не нужен.'
    lang: ru
  - type: faq
    question: 'Какие документы нужны для договора?'
    answer: 'Паспорт плательщика. Для ребёнка — свидетельство о рождении.'
    lang: ru
  - type: faq
    question: 'Можно ли заморозить обучение?'
    answer: 'Паузу до 30 дней оформляет администратор, счёт за этот месяц не выставляется.'
    lang: ru
  - type: faq
    question: 'Есть ли скидка за двоих детей?'
    answer: 'Семейную скидку подтверждает администратор, бот её не обещает.'
    lang: ru
  - type: faq
    question: 'Как узнать баланс и долг?'
    answer: 'Напишите «какой баланс» с номера, который указан в договоре.'
    lang: ru
  - type: faq
    question: 'Когда выставляется счёт?'
    answer: 'Счёт приходит за 3 дня до даты оплаты и повторяется, пока не оплачен.'
    lang: ru
  - type: faq
    question: 'Что будет, если не оплатить вовремя?'
    answer: 'Напомним на 0, 3 и 7 день. На 10-й день подключится администратор.'
    lang: ru
  - type: faq
    question: 'Можно ли оплатить наличными?'
    answer: 'Да, в кассе центра. Администратор отметит оплату, напоминания остановятся.'
    lang: ru
  - type: faq
    question: 'Есть ли ваучер на допобразование в Шымкенте?'
    answer: 'Для центров Казахстана ваучер на допобразование можно использовать, если курс в перечне. Подскажет администратор.'
    lang: ru
  - type: faq
    question: 'Как проходит занятие?'
    answer: 'Небольшая группа, преподаватель ведёт урок по программе уровня. Домашнее задание короткое.'
    lang: ru
  - type: faq
    question: 'Сколько человек в группе?'
    answer: 'Обычно до 10–12. Точное число мест бот смотрит в расписании группы.'
    lang: ru
  - type: faq
    question: 'Когда стартует группа?'
    answer: 'Когда набрано минимальное число учеников. Дату старта видно в карточке группы.'
    lang: ru
  - type: faq
    question: 'Что если группа не наберётся?'
    answer: 'Предложим другую группу того же уровня или вернём предоплату за неоткрытую группу.'
    lang: ru
  - type: faq
    question: 'Можно ли сменить группу?'
    answer: 'Да, если в другой группе есть место. Это делает администратор.'
    lang: ru
  - type: faq
    question: 'Есть ли онлайн-формат?'
    answer: 'Основной формат очный. Онлайн-группу подтверждает администратор.'
    lang: ru
  - type: faq
    question: 'Как отменить пробное?'
    answer: 'Напишите «отмените пробное» не позже чем за 3 часа.'
    lang: ru
  - type: faq
    question: 'Как перенести пробное?'
    answer: 'Напишите «перенесите пробное», подберём другое время.'
    lang: ru
  - type: faq
    question: 'Нужно ли проходить тест уровня?'
    answer: 'Для языковых и экзаменационных курсов да: 12–15 вопросов в чате, без оценки «сдал/не сдал».'
    lang: ru
  - type: faq
    question: 'Сколько длится тест уровня?'
    answer: 'Около 5–7 минут, ответы кнопками.'
    lang: ru
  - type: faq
    question: 'Гарантируете ли вы балл или поступление?'
    answer: 'Нет. Результат зависит от ученика. Расскажем программу, обещаний баллов не даём.'
    lang: ru
  - type: faq
    question: 'Можно ли торговаться о цене?'
    answer: 'Цену и скидку согласует администратор. Бот не называет скидку, которой нет в прайсе.'
    lang: ru
  - type: faq
    question: 'Кто видит оценки ребёнка?'
    answer: 'Только родитель или сам взрослый ученик, чей номер есть в договоре.'
    lang: ru
  - type: faq
    question: 'Можно ли спросить про чужого ученика?'
    answer: 'Нет. Данные другого ученика не сообщаем.'
    lang: ru
  - type: faq
    question: 'Как удалить мои данные?'
    answer: 'Напишите «удалите мои данные». Запрос уйдёт администратору, срок — до 15 рабочих дней.'
    lang: ru
  - type: faq
    question: 'Есть ли парковка?'
    answer: 'Да, у здания. Точный въезд подскажет администратор.'
    lang: ru
  - type: faq
    question: 'Работаете ли вы в праздники?'
    answer: 'Праздничные дни публикуем заранее. Если урок отменён, напишем всей группе.'
    lang: ru
  - type: faq
    question: 'Как предупредить об отсутствии?'
    answer: 'Напишите в этот чат до начала урока. Преподаватель увидит отметку.'
    lang: ru
  - type: faq
    question: 'Что если преподаватель заболел?'
    answer: 'Урок переносят или заменяют. Сообщение приходит всем ученикам группы.'
    lang: ru
  - type: faq
    question: 'Есть ли сертификат по окончании?'
    answer: 'Сертификат центра выдаётся после прохождения уровня. Государственный диплом не выдаём.'
    lang: ru
  - type: faq
    question: 'Можно ли заниматься индивидуально?'
    answer: 'Индивидуальные занятия есть не во всех курсах. Уточнит администратор.'
    lang: ru
  - type: faq
    question: 'Как оставить отзыв?'
    answer: 'Через месяц после старта попросим оценку. Публиковать отзыв или нет — решаете вы.'
    lang: ru
  - type: faq
    question: 'Есть ли каникулы?'
    answer: 'Короткий перерыв между уровнями. Счёт за месяц каникул не выставляется, если группа стоит.'
    lang: ru
  - type: faq
    question: 'Как связаться с администратором?'
    answer: 'Напишите «позовите человека» — передадим диалог администратору.'
    lang: ru
  - type: faq
    question: 'На каких языках вы отвечаете?'
    answer: 'Русский, узбекский и казахский — на языке, на котором написали.'
    lang: ru
sequences:
  trial_followup:
    steps:
      - {offset_h: 2, template: trial_followup_1}
      - {offset_h: 24, template: trial_followup_2}
      - {offset_h: 72, template: trial_followup_3}
    stop_on: [reply, payment, opt_out]

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image ships btree_gist and pg_trgm, which the schema needs.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/arix_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/arix_test
      SECRET_KEY: ci-secret-key-at-least-32-characters
      # No API key in CI: the deterministic brain keeps the suite hermetic.
      LLM_FORCE_SCRIPTED: "true"
      CHANNELS_DRY_RUN: "true"
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: python -m ruff check arix tests
      # WIP: the edu migration, API layer and eval set are not written yet
      # (see docs/STATUS.md). Until then CI only runs the shared-core unit
      # tests, so a red build always means a real regression.
      - name: Tests (shared core, unit only)
        working-directory: backend
        run: python -m pytest -q tests/test_guardrails.py tests/test_pii.py tests/test_timeutil.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build

  waweb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: waweb
        run: |
          for file in src/*.js; do node --check "$file"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build waweb image
        run: docker compose build waweb
